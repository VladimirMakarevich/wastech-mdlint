name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Workspace-wide gate on the pinned Node 24 LTS line (.node-version). tsc -b, vitest, and
    # eslint all fan out across packages/{core,cli,mcp-server} through the root scripts; prettier
    # --check runs once over the whole tree so style drift fails fast alongside them.
    # Keep the OS matrix scoped here so path/newline/glob behavior is covered on every runtime
    # host without multiplying the package-shaped tarball checks below.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"
      # Lockfile-based install: npm ci fails on any package.json <-> lockfile drift, which is
      # exactly the reproducibility guarantee we want in CI instead of a mutating `npm install`.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run build
      # Run the product against this repository's own documentation, so a dead link or a broken
      # heading anchor under docs/ fails the build instead of surviving until someone reads the page.
      # It must come after the build for two reasons: the script spawns the compiled entrypoint by
      # path, and `node_modules/.bin/wastech-mdlint` does not exist to spawn instead — npm skips
      # creating a bin link whose target file is absent at install time, and `npm ci` runs long
      # before dist/ is emitted.
      - run: npm run lint:docs

  audit:
    # The production dependency tree only — the packages a consumer of the published tarballs
    # actually installs. Split from the full audit deliberately, because the two answer different
    # questions and the workspace one is dominated by the toolchain that builds and tests the
    # packages and ships in nothing. Without the split the production signal is invisible: the
    # lockfile once pinned an SDK at the top of a vulnerable range for months while the range we
    # publish resolved clean, so CI, every packed artifact and every contributor's machine exercised
    # versions no user received. Nothing caught it, because the only audit anyone ran mixed the two
    # trees together and was noisy either way.
    #
    # Ubuntu alone: the resolved tree comes from the lockfile, so a second and third OS would
    # re-audit identical package versions.
    #
    # `--audit-level=high` rather than the default `low`: advisories are published on a schedule
    # nobody here controls, so a stricter gate turns a red build into a routine event on pull
    # requests that changed nothing about dependencies — and a gate people learn to ignore protects
    # less than one that fires rarely. Moderate and low findings still print in the job log for
    # anyone reading it; only high and critical stop the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  pack:
    # Publish-readiness in *shape* only: prove each package's `files` allowlist yields a clean
    # tarball. Actually publishing core+cli+mcp under one tag is the release workflow's job, not this one.
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@wastech-mdlint/core"
          - "@wastech-mdlint/cli"
          - "@wastech-mdlint/mcp-server"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      # dist/ must exist before packing because every package's `files` allowlist is ["dist"].
      - run: npm run build
      - run: npm pack --dry-run -w ${{ matrix.package }}
