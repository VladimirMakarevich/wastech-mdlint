name: Publish

# A single `vX.Y.Z` tag publishes all three packages at that version.
#
# Publishing runs in the same job as the gate, not a downstream one, so there is no window in which
# a green gate and a later publish disagree about which commit they ran on.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # Required to mint the short-lived OIDC token npm exchanges for publish rights, and which it signs
  # the provenance attestation with. Authentication carries no stored credential: npm holds a trust
  # relationship between each package and this repository plus this workflow's filename, matched
  # exactly and case-sensitively. Renaming or moving this file therefore breaks publishing until that
  # relationship is updated on all three packages, which is why the name is not merely cosmetic.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # No registry credential is set here on purpose. An empty `NODE_AUTH_TOKEN` is not the same as an
    # absent one: the npmrc that `setup-node` writes would carry an empty auth line, and the registry
    # answers a blank credential with a rejection rather than falling through to the OIDC exchange.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci

      # The tag is what a human types and the manifests are what actually gets published; nothing
      # else compares them. A mismatch here would publish a version nobody tagged, under a tag
      # pointing at a different version, and neither is correctable after the fact because npm
      # refuses to republish a version number.
      - name: Tag matches the published version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          for package in core cli mcp-server; do
            manifest_version="$(node -p "require('./packages/${package}/package.json').version")"
            if [ "${manifest_version}" != "${tag_version}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match @wastech-mdlint/${package}@${manifest_version}." >&2
              exit 1
            fi
          done

      # The full gate. `lint` and `format` are here because this workflow triggers on a tag rather
      # than on the pull request CI gates, so a style failure could otherwise reach a tag through a
      # direct push. `build` must precede both the docs lint and the publish: the docs lint runs the
      # built CLI against this repository's own documentation, and the cross-workspace publish path
      # runs no lifecycle script that would emit `dist` on its own.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run build
      - run: npm run lint:docs
      - run: npm pack --dry-run --workspaces

      # `core` first, and separately: `cli` and `mcp-server` pin it by exact version, so publishing
      # them against a registry that does not yet carry that `core` version leaves the first consumer
      # to install a dependency that cannot resolve.
      #
      # Each step skips a version the registry already carries. The registry refuses to overwrite a
      # published version, so without the check a release that failed partway cannot be re-run: it
      # would abort on the package that already succeeded and never reach the ones that did not. The
      # same check is what lets a tag be pushed for a release published by other means — the earliest
      # version of each package predates any trust relationship npm could authenticate this workflow
      # against, so it was published by hand.
      - name: Publish @wastech-mdlint/core
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          if [ -n "$(npm view "@wastech-mdlint/core@${version}" version 2>/dev/null)" ]; then
            echo "@wastech-mdlint/core@${version} is already in the registry; nothing to publish."
          else
            npm publish -w @wastech-mdlint/core --provenance
          fi

      - name: Publish @wastech-mdlint/cli
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ -n "$(npm view "@wastech-mdlint/cli@${version}" version 2>/dev/null)" ]; then
            echo "@wastech-mdlint/cli@${version} is already in the registry; nothing to publish."
          else
            npm publish -w @wastech-mdlint/cli --provenance
          fi

      - name: Publish @wastech-mdlint/mcp-server
        run: |
          version="$(node -p "require('./packages/mcp-server/package.json').version")"
          if [ -n "$(npm view "@wastech-mdlint/mcp-server@${version}" version 2>/dev/null)" ]; then
            echo "@wastech-mdlint/mcp-server@${version} is already in the registry; nothing to publish."
          else
            npm publish -w @wastech-mdlint/mcp-server --provenance
          fi
