# Regenerated by `wastech-orchestrator upgrade-config`.
# New keys were added from the packaged template with their default values; your existing
# values were preserved. Inline comments are not kept here — see the annotated
# config.example.yaml under .worc/ for documentation of every field.
schema_version: 34
orchestrator:
  auto_mode:
    enabled: false
    confirm_next_task: false
  poll_interval_seconds: 300
  queue: default
repo:
  url: https://github.com/VladimirMakarevich/wastech-mdlint.git
  local_path: /Users/a1234/Documents/GitHub/wastech-mdlint
  base_branch: main
  branch_prefix: worc
  branch_mode: new
paths:
  tasks_dir: tasks
agents:
  # codex temporarily removed to test Claude usage limits without a cross-provider
  # fallback hop. The `providers.codex` block below is left intact — re-add the
  # list entry to restore fallback. (Note: it never actually rescued a run — every
  # fallback attempt on 2026-08-06 failed with `authentication_failed`.)
  allowed:
  - claude
  max_stage_attempts: 3
  max_fix_cycles: 15
  max_total_fix_iterations: 30
  decomposition:
    enabled: false
    max_subtasks: 8
  retry:
    max_attempts: 2
    base_delay_s: 2.0
    max_delay_s: 30.0
    max_blocked_s: 21600.0
  providers:
    claude:
      command: claude
      model: claude-opus-5
      reasoning: xhigh
      timeout_seconds: 7200
      max_turns: 400
      max_turns_gate: false
      permission_profile: workspace-write
      extra_args: []
      primary: true
    codex:
      command: codex
      model: gpt-5.4
      reasoning: high
      timeout_seconds: 7200
      permission_profile: workspace-write
      extra_args: []
security:
  strict_isolation: true
  disable_read_isolation: true
  allow_git_evidence: true
  allowed_environment:
  - PATH
  - HOME
  - USER
  - USERPROFILE
  - CODEX_HOME
  - CLAUDE_CONFIG_DIR
  - TMPDIR
  - LD_LIBRARY_PATH
  - DYLD_LIBRARY_PATH
  denied_read_paths:
  - .env
  - .worc/.env
  - secrets/**
  denied_commands:
  - git commit
  - git push
  - gh pr create
  - gh pr merge
  trust_level: auto
  protected_paths: []
validation:
  max_task_bytes: 262144
  max_task_lines: 5000
  max_line_bytes: 8192
  max_control_ratio: 0.01
  required_fields:
  - id
  - title
  reject_unknown_fields: true
  quarantine_folder: /Users/a1234/Documents/GitHub/wastech-mdlint/.worc/tasks/rejected
checks:
  command_sets:
    # Scoped so a documentation-only diff (a deep_research report under docs/research/) does not drag
    # the whole npm cycle behind it. The runner runs the union of sets whose paths glob the diff, so a
    # change touching both code and Markdown runs both sets.
    default:
      paths:
      - packages/**
      - scripts/**
      - skills/**
      - .github/**
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.mjs'
      - '*.cjs'
      commands:
      - name: install
        argv:
        - npm
        - ci
      - name: typecheck
        argv:
        - npm
        - run
        - typecheck
      - name: lint
        argv:
        - npm
        - run
        - lint
      - name: format
        argv:
        - npm
        - run
        - format
      - name: test
        argv:
        - npm
        - test
      - name: build
        argv:
        - npm
        - run
        - build
    # The gate for every Markdown the orchestrator commits — research reports included. `format` is
    # `prettier --check .` (a checking command, so it never trips the green-but-dirtying guard) and it
    # enforces the repo's proseWrap: never rule on the committed document.
    docs:
      paths:
      - '**/*.md'
      commands:
      - name: format
        argv:
        - npm
        - run
        - format
  timeout_seconds: 7200
git:
  create_pull_request: true
  pr_base: main
  auto_merge: false
  auto_merge_strategy: squash
  auto_merge_wait_for_checks: false
  merge_flow: merge
  footprint:
    audit_commit_message: 'chore(orchestrator): audit trail for {task_id}'
    audit_on_branch: task
telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  ask_timeout_s: 28800
  trace: true
skills:
  dynamic: false
  strict: false
supervisor:
  enabled: true
  role_file: roles/supervisor.md
  provider: claude
  observe:
    mode: events
    triggers:
    - rework
    - failure
    - fallback
    include_nodes: []
    model: claude-sonnet-5
    reasoning: low
  finalize:
    model: claude-sonnet-5
    reasoning: medium
  handoff:
    model: claude-sonnet-5
    reasoning: medium
logging:
  level: debug
  artifacts: full
  clean_runs_on_success: true
memory:
  enabled: false
  short_term_ttl_days: 30
  packet_max_lines: 120
  packet_max_long_term: 3
  packet_max_entity: 5
  packet_max_episodic: 3
  promote_min_tasks: 2
  promote_window_days: 60
  cleanup_min_interval_s: 300
  cleanup_max_scanned: 200
  cleanup_max_edits: 50
  cleanup_max_wall_clock_s: 5.0
  cleanup_promotions_per_pass: 0
tools:
  default_timeout_seconds: 3600
prompt_audit: true
