# Packaged built-in flow: implementation — the executable default flow the engine drives.
#
# The pipeline expressed as data: planning -> implementation -> testing(checks) -> review(evaluator)
# -> documentation -> publish, with the two fix loops (through fixing) and decomposition. `planning`
# is the entry node. After review accepts the code, `documentation` updates the target project's docs
# to match the change just shipped (workspace-write, in its own fresh session), and its edits join
# the same diff the orchestrator commits. Any node can be disabled per task via
# `nodes.<id>.enabled: false` — the one place a task may name a node id instead of stating a `when`
# fact, deliberately bounded to this on/off switch.
#
# LOCAL DEVIATION 1 — the packaged `refinement` node is REMOVED (with its role prompt), so the flow
# starts at `planning`. Two reasons, both structural rather than stylistic: its `when` predicate
# (`derived.needs_refinement`) is a FORMEDNESS check — a non-empty description plus an
# `## Acceptance criteria` section already counts as complete, so every task authored through the
# worc-task skill skipped it anyway — and its `enriched_spec` output is an AUDIT-ONLY slot with no
# prompt variable and no downstream consumer, so even when it did fire the plan was never built from
# it. The clarifying-question path it owned is not lost: `planning` carries
# `hitl: { allow_question: true, allow_approval: true }`, and a `human_input` answer file propagates
# from there exactly as it did from refinement. Restore the node from the packaged flow if you ever
# want the audit artifact back.
#
# LOCAL DEVIATION 2 — every editing node (`implementation`, `fixing`,
# `documentation`) is pinned to `fresh_disposable` instead of the shipped `editing_lineage`, so no
# stage carries a stale in-session view of the tree across a checks/review round trip. That also
# means `lineage_affinity` is absent by design — it is only valid against an `editing_lineage` owner
# and the flow validator rejects it otherwise. Revert both together if you ever want durable
# sessions back.
#
# Two behaviors here are not visible in the YAML: `review` is an evaluator (findings gate the graph,
# they are not advisory), and the core enforces the commit-candidate mutation guard whenever a
# `checks` node is present — it is not declared here. An optional non-blocking `testing_quality`
# evaluator (the shared evaluator runner already supports its self-cap) is NOT shipped in this
# default flow: it is a pure graph-shape choice — an operator who wants it adds the node to their
# own flow YAML.
#
# WHERE THE MARKDOWN GATE LIVES (read this before moving `documentation`): that node edits the tree
# AFTER the last `checks` node, and the mutation guard the core enforces is the green-but-dirtying
# one — it only catches a check command that rewrote the tree, never a later node's edits. So the
# `prettier --check .` gate this repository requires for every committed deliverable — docs
# included — is enforced for the documentation node's own edits by its role prompt, not by the
# graph. A second `checks` node after `documentation` would make it deterministic, at a real price:
# command-set selection runs the union of sets matching the WHOLE task diff since base, so on any
# code task it would re-run `npm ci` + typecheck + lint + test + build a second time, not just the
# `docs` set. If you ever want that guarantee cheaply, add a `tool` node under .worc/tools/ that
# runs the format check alone and loop its `fail` edge back to `documentation` with a small budget.
#
# NOTE: the supervisor is NOT a graph node. It is an orchestrator layer ABOVE any flow
# (summary + per-step advisory oversight, configured in config.yaml: supervisor). There is NO
# `summary` node here: the whole-task summary is written at close, before publish — by the
# supervisor layer at the cadence config.yaml sets, and deterministically from the run's own
# recorded facts when that layer is switched off (`supervisor.enabled: false`).
#
# ----------------------------------------------------------------------------------------------------
# Per-node tuning (ALL fields below are OPTIONAL — omit one to inherit the default). Every
# agent/evaluator node in this flow carries the provider/model/reasoning slots commented out so the
# full configuration surface is visible; uncomment and edit to pin a single node.
#   agent + evaluator nodes:
#     provider:  codex | claude            which agent runs the node (∈ agents.allowed); default: global primary
#     model:     <model id>                overrides agents.providers.<provider>.model for THIS node
#     reasoning: minimal|low|medium|high|xhigh|max  default: agents.providers.<provider>.reasoning
#     network_access: true | false         per-node network grant/deny; default: flow network_policy
#   agent nodes also: timeout_seconds, extra_args (extra CLI flags), best_effort,
#                     permission_profile (≤ flow permission_ceiling), when
#   evaluator nodes also: blocking (failing verdict blocks vs advisory), max_rework_per_stage,
#                     gate_severity (min finding severity that gates: high|medium|low|critical|blocking; default high)
#     (a non-blocking evaluator that spends max_rework_per_stage with a finding still open accepts +
#      continues — never manual — and warns you via a console warning + a ⚠️ telegram trace)
#   Disabling a node is PER-TASK, not here: set `nodes.<id>.enabled: false` in the task file.
# ----------------------------------------------------------------------------------------------------
flow:
  name: implementation
  task_type: implementation
  permission_ceiling: workspace-write
  output_policy: code_change
  publishing: pull_request

  nodes:
    - id: planning
      kind: agent
      role_file: implementation/planning.md
      session_scope: fresh_disposable
      permission_profile: read-only
      output_artifact: plan
      hitl: { allow_question: true, allow_approval: true }
      # Operator pin: planning sets the shape the rest of the flow executes, so it gets the deepest
      # reasoning tier rather than the flow-wide default. Provider/model are deliberately NOT pinned
      # — they come from config.yaml (claude is primary at claude-opus-5).
      reasoning: xhigh
      # timeout_seconds: 7200
      # network_access: false
      # extra_args: []
    - id: implementation
      kind: agent
      role_file: implementation/implementation.md
      # Operator choice: every editing node in this flow runs as a fresh disposable session rather
      # than the packaged `editing_lineage`, so each stage re-reads the tree instead of trusting a
      # carried-over view of it. `lineage_affinity` is therefore dropped from `fixing` /
      # `documentation` below — it is only valid against an `editing_lineage` owner.
      session_scope: fresh_disposable
      permission_profile: workspace-write
      reasoning: xhigh
      # timeout_seconds: 7200
      # network_access: false
      # extra_args: []
      # best_effort: false
    - id: testing
      kind: checks
      checker: command_profile
    - id: review
      kind: evaluator
      role: review
      role_file: implementation/review.md
      session_scope: fresh_disposable
      permission_profile: read-only
      # Operator grant: the reviewer is told to judge only what THIS task changed, but the branch
      # diff can be cumulative (a shared branch carries earlier tasks' commits) and a read-only
      # Claude node has no shell at all — so without this it had to guess that boundary from the
      # diff file. `git_evidence` adds a shell scoped to the read-only verbs (log/show/diff/blame/
      # status/rev-*/ls-files/shortlog/describe/cat-file/for-each-ref) so it can resolve the
      # boundary from history instead. Honored because security.allow_git_evidence is on for this
      # repository (the same grant deep_research and security_audit already rely on); the node stays
      # read-only either way — the sandbox write-denies the clone and denied_commands still bans
      # commit/push/PR. On this host (macOS Seatbelt) the sandboxed shell is always available.
      git_evidence: true
      # optional overrides (uncomment to pin this evaluator):
      # provider: claude
      # model: claude-opus-5
      # reasoning: high
      # network_access: false
      # blocking: true
      # gate_severity: high  # min finding severity that gates (high|medium|low|critical|blocking).
      #   Default high = block on high/critical/blocking; lower it (e.g. medium) to gate on nits too.
      # NOTE: `max_rework_per_stage` is a NON-blocking-only knob (e.g. test_quality) — it has no
      # effect on this blocking review node. To cap the review->fixing loop deterministically, lower
      # `budgets.review_fix` below; exhausting it parks the task to `manual`.
    - id: fixing
      kind: agent
      role_file: implementation/fixing.md
      session_scope: fresh_disposable
      permission_profile: workspace-write
      # Cost pin: this node does not decide WHAT to change — `review` hands it a
      # findings list where every item already carries a concrete `fix`, and
      # `testing` hands it a failing command. Executing a specified change is
      # exactly where Sonnet 5 lands closest to Opus, so the generator runs cheap
      # while the Opus reviewer that gates it stays expensive — a strong critic
      # over a cheaper fixer, not a cheaper critic. `high` rather than `xhigh` for
      # the same reason: the search space was already narrowed upstream.
      # Watch the review->fixing loop count after this change: a fix that needs a
      # second rework round costs more than the model saved, so if `budgets.review_fix`
      # starts being consumed where it wasn't, revert this pin first.
      provider: claude
      model: claude-sonnet-5
      reasoning: high
      # timeout_seconds: 7200
      # network_access: false
      # extra_args: []
    # Whole-task docs update after the code is accepted: an ordinary workspace-write agent that
    # mirrors `fixing` (no output_artifact, no hitl/when). Like the other editing nodes it runs
    # fresh-disposable here, so it reads the shipped diff off the tree rather than inheriting the
    # implementation session's view of it. It is deliberately kept OUT of decomposition.sub_flow so
    # it runs once per task (after the last subtask), not once per subtask.
    - id: documentation
      kind: agent
      role_file: implementation/documentation.md
      session_scope: fresh_disposable
      permission_profile: workspace-write
      # Documentation is a mechanical write-up of what already shipped, so it runs at medium
      # reasoning regardless of the flow-wide default — no quality loss, less wall-time on the tail.
      # Same argument extends to the model: the diff is already on the tree and accepted, so this
      # node transcribes rather than decides. Cheapest node to move off Opus with no judgment at risk.
      provider: claude
      model: claude-sonnet-5
      reasoning: medium
      # Explicit offline stance: doc-writing needs no network, and pinning it here keeps the node
      # offline even if this flow later gains a flow-wide network_policy. This is a hard guarantee
      # only under Codex (OS-sandbox blocks Bash network); under Claude it only disables
      # WebFetch/WebSearch, so it is defense-in-depth (the role prompt forbids installs, builds,
      # tests and servers) — pin `provider: codex` on this node when you need the hard "no
      # dependency installs" guarantee. That pin currently fails preflight: `codex` was removed
      # from `agents.allowed` in config.yaml for a Claude-only limits test — re-add it there first.
      # The one command the role prompt REQUIRES here is this
      # repository's own Markdown format gate (`npm run format` = `prettier --check .`, repaired with
      # a targeted `npx prettier --write <paths>`): it mutates nothing but docs, needs no network,
      # and resolves prettier out of the node_modules the run's own checks step already installed.
      network_access: false
      # other optional overrides (uncomment to pin this node):
      # provider: claude
      # model: claude-opus-5
      # timeout_seconds: 7200
      # extra_args: []
    - id: publish
      kind: publish
      policy: pull_request

  edges:
    - { from: planning, to: implementation }
    - { from: implementation, to: testing }
    - { from: testing, to: review, outcome: pass }
    - { from: testing, to: fixing, outcome: fail, loop: test_fix }
    - { from: review, to: documentation, outcome: accept } # accepted code -> docs update -> publish
    - { from: review, to: fixing, outcome: rework, loop: review_fix }
    - { from: fixing, to: testing }
    - { from: documentation, to: publish } # whole-task summary + advisory oversight = supervisor layer

  budgets:
    global_fix_iterations: 30
    test_fix: 15
    review_fix: 15

  # Flow-local supervisor prompts + the tech-debt/follow-ups opt-in. The
  # supervisor is a constant layer above the flow, not a node; this block only reshapes ITS wording
  # (the structured-output schemas stay in code). `role_file` overrides the global observe lens;
  # `finalize_role_file` is the final-summary emphasis; `emit_follow_ups` opts the finalize turn into
  # the evidence-gated `follow_ups` array (a code-oriented capability — research/prose flows omit it).
  # `observe.mode: events` is stated here rather than inherited so this flow's cadence is visible where
  # its prompts are: `emit_follow_ups: true` means the finalize turn's follow-ups and the memory delta
  # are worth grounding in observed deviations, so `none` would starve them — but a note on every
  # ordinary step bought nothing. `events` observes only a rework loop, a failed step, or a provider
  # fallback, which is exactly what a reviewer of a long implementation run needs flagged.
  supervisor:
    role_file: implementation/supervisor.md
    finalize_role_file: implementation/summary.md
    emit_follow_ups: true
    observe:
      mode: events

  decomposition:
    proposed_by: planning
    sub_flow: [implementation, testing, review, fixing]
    shared_budget: global_fix_iterations
